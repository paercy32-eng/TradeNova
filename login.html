<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<title>Sign in — Nova Trade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: linear-gradient(rgba(11, 17, 32, 0.85), rgba(11, 17, 32, 0.95)), 
                url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat fixed;
    color: #111827;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 20px;
    padding: 2.5rem 2rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .logo-container { text-align: center; margin-bottom: 2rem; }
  .logo-text {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
    color: #111827;
  }
  .logo-text span {
    color: #ec4899;
    text-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
  }

  h1 { font-size: 1.5rem; margin-bottom: 0.4rem; text-align: center; color: #111827; }
  .subtitle { color: #6b7280; font-size: 0.85rem; text-align: center; margin-bottom: 2rem; }

  .field { margin-bottom: 1.2rem; }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #4b5563;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%;
    padding: 0.85rem 1rem;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    color: #111827;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  .field input:focus {
    outline: none;
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
  }

  .btn-submit {
    width: 100%;
    padding: 1rem;
    background: #ec4899;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 1rem;
    transition: 0.2s;
  }
  .btn-submit:hover { background: #db2777; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .form-msg { text-align: center; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2rem; }
  .form-msg.err { color: #ef4444; }
  .form-msg.ok { color: #10b981; }

  .auth-foot { text-align: center; font-size: 0.85rem; color: #6b7280; margin-top: 2rem; }
  .auth-foot a { color: #ec4899; text-decoration: none; font-weight: 700; }
  .auth-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo-container">
    <div class="logo-text">Nova<span>Trade</span></div>
  </div>

  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to manage your portfolio.</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>

    <button class="btn-submit" type="submit" id="submitBtn">Sign In</button>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <p class="auth-foot">New to Nova Trade? <a href="register.html">Create an account</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  var form     = document.getElementById('loginForm');
  var email    = document.getElementById('email');
  var passwd   = document.getElementById('password');
  var msg      = document.getElementById('formMsg');
  var submit   = document.getElementById('submitBtn');

  function setMsg(kind, text) {
    msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  TN.ready.then(function () {
    return TN.getSession().then(function (session) {
      if (session) { 
        return checkRoleAndRedirect(session.user.id);
      }
    });
  }).catch(function (err) { console.error(err); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var userEmail = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) {
      setMsg('err', 'Enter a valid email address.'); return;
    }
    if (!passwd.value) {
      setMsg('err', 'Enter your password.'); return;
    }

    submit.disabled = true;
    setMsg('', 'Signing you in…');

    TN.ready.then(function () {
      return TN.signIn(userEmail, passwd.value);
    }).then(function (result) {
      if (result.error) throw result.error;
      setMsg('ok', 'Signed in. Loading…');
      return checkRoleAndRedirect(result.data.user.id);
    }).catch(function (err) {
      var m = (err && err.message) || '';
      if (/Invalid login credentials/i.test(m)) {
        setMsg('err', 'Wrong email or password.');
      } else {
        setMsg('err', m || 'Something went wrong.');
      }
      submit.disabled = false;
    });
  });

  function checkRoleAndRedirect(userId) {
    return TN.client.from('profiles').select('role').eq('id', userId).single()
    .then(function(res) {
      if (res.data && res.data.role === 'admin') {
        window.location.replace('admin.html');
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  }

})();
</script>
</body>
</html>
