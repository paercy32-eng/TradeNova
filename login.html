<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdf2f8">
<title>Sign in — Nova Trade</title>
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    background: #fdf2f8; /* Very light pink background */
    color: #111827;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Trading Banner */
  .banner {
    width: 100%;
    height: 220px;
    background: linear-gradient(rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.2)), 
                url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
    border-bottom: 4px solid #ec4899;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .banner-text {
    color: #fff;
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0,0,0,0.7);
  }
  .banner-text span { color: #ec4899; }

  /* Form Container */
  .auth-container {
    flex: 1;
    padding: 2rem 1.5rem;
    max-width: 450px;
    margin: 0 auto;
    width: 100%;
  }

  .auth-title {
    font-size: 1.4rem;
    color: #ec4899;
    font-weight: 800;
    margin-bottom: 1.5rem;
  }

  /* Input Fields */
  .field { margin-bottom: 1rem; }
  .input-group {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #fbcfe8;
    border-radius: 12px;
    padding: 0 1rem;
    transition: 0.2s;
  }
  .input-group:focus-within {
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
  }
  .input-group i {
    color: #ec4899;
    font-size: 1.1rem;
    width: 24px;
  }
  .input-group input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 1rem 0.5rem;
    font-size: 0.95rem;
    color: #111827;
    outline: none;
  }
  .input-group input::placeholder { color: #9ca3af; }

  /* Remember Me */
  .remember-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 1rem 0 1.5rem;
    font-size: 0.85rem;
    color: #4b5563;
    font-weight: 600;
  }
  .remember-row input { accent-color: #ec4899; width: 18px; height: 18px; }

  /* Submit Button */
  .btn-submit {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(90deg, #ec4899, #db2777);
    color: #ffffff;
    border: none;
    border-radius: 30px; /* Pill shape */
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    transition: 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5); }
  .btn-submit:disabled { opacity: 0.7; transform: none; box-shadow: none; }

  /* Messages & Footer */
  .form-msg { text-align: center; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2rem; font-weight: bold; }
  .form-msg.err { color: #ef4444; }
  .form-msg.ok { color: #10b981; }

  .auth-foot { text-align: center; font-size: 0.95rem; color: #4b5563; margin-top: 2rem; font-weight: 600; }
  .auth-foot a { color: #ec4899; text-decoration: none; font-weight: 800; }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-text">Nova<span>Trade</span></div>
</div>

<div class="auth-container">
  <h1 class="auth-title">Login</h1>

  <form id="loginForm" novalidate>
    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input id="email" name="email" type="email" placeholder="Enter Email Address" autocomplete="email" required>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input id="password" name="password" type="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
    </div>

    <label class="remember-row">
      <input type="checkbox"> Remember me
    </label>

    <button class="btn-submit" type="submit" id="submitBtn">Login</button>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <p class="auth-foot">New here? <a href="register.html">Create Account</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  var form     = document.getElementById('loginForm');
  var email    = document.getElementById('email');
  var passwd   = document.getElementById('password');
  var msg      = document.getElementById('formMsg');
  var submit   = document.getElementById('submitBtn');

  function setMsg(kind, text) {
    msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  TN.ready.then(function () {
    return TN.getSession().then(function (session) {
      if (session) { 
        return checkRoleAndRedirect(session.user.id);
      }
    });
  }).catch(function (err) { console.error(err); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var userEmail = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) {
      setMsg('err', 'Enter a valid email address.'); return;
    }
    if (!passwd.value) {
      setMsg('err', 'Enter your password.'); return;
    }

    submit.disabled = true;
    setMsg('', 'Signing you in…');

    TN.ready.then(function () {
      return TN.signIn(userEmail, passwd.value);
    }).then(function (result) {
      if (result.error) throw result.error;
      setMsg('ok', 'Signed in. Loading…');
      return checkRoleAndRedirect(result.data.user.id);
    }).catch(function (err) {
      var m = (err && err.message) || '';
      if (/Invalid login credentials/i.test(m)) {
        setMsg('err', 'Wrong email or password.');
      } else {
        setMsg('err', m || 'Something went wrong.');
      }
      submit.disabled = false;
    });
  });

  function checkRoleAndRedirect(userId) {
    return TN.client.from('profiles').select('role').eq('id', userId).single()
    .then(function(res) {
      if (res.data && res.data.role === 'admin') {
        window.location.replace('admin.html');
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  }

})();
</script>
</body>
</html>
