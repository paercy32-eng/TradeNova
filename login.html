<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="Sign in to Trade Nova — copy top crypto traders across Africa.">
<title>Sign in — Trade Nova</title>
<link rel="stylesheet" href="css/styles.css">
<style>
/* Same auth styles as register.html */
.auth-page{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:2rem 1.15rem}
.auth-card{width:100%;max-width:440px;background:var(--surface,#111820);border:1px solid var(--border,#22303f);border-radius:16px;padding:2rem 1.6rem}
.auth-card h1{font-size:1.5rem;margin:0 0 .35rem}
.auth-sub{color:var(--muted,#8fa3b8);font-size:.88rem;margin:0 0 1.5rem}
.auth-card .field{margin-bottom:.85rem}
.field-hint{font-size:.73rem;color:var(--muted,#8fa3b8);margin:.28rem 0 0;opacity:.8}
.auth-foot{text-align:center;font-size:.85rem;color:var(--muted,#8fa3b8);margin:1.2rem 0 0;padding-top:1.2rem;border-top:1px solid var(--border,#22303f)}
.auth-foot a{color:#4f8cff;font-weight:600}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3 17l5-6 4 3 5-7 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Trade Nova</span>
    </a>
    <a class="btn btn-ghost btn-sm" href="register.html" style="margin-left:auto">Register</a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to manage your copy trading portfolio.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">
        Sign in
      </button>
      <p class="form-msg" id="formMsg" role="status"></p>
    </form>

    <p class="auth-foot">New to Trade Nova? <a href="register.html">Create an account</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  var form     = document.getElementById('loginForm');
  var email    = document.getElementById('email');
  var passwd   = document.getElementById('password');
  var msg      = document.getElementById('formMsg');
  var submit   = document.getElementById('submitBtn');

  function setMsg(kind, text) {
    msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  // 1. If already signed in, redirect to dashboard
  TN.ready.then(function () {
    return TN.getSession().then(function (session) {
      if (session) { 
        window.location.replace('dashboard.html'); 
        throw new Error('__redirect'); 
      }
    });
  }).catch(function (err) {
  if (err && err.message === '__redirect') return;
  setMsg('err', 'Error: ' + (err.message || 'Unknown error'));
});

  // 2. Handle form submission
  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var userEmail = email.value.trim();
    
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) {
      setMsg('err', 'Enter a valid email address.'); 
      email.focus(); 
      return;
    }
    
    if (!passwd.value) {
      setMsg('err', 'Enter your password.'); 
      passwd.focus(); 
      return;
    }

    submit.disabled = true;
    setMsg('', 'Signing you in…');

    TN.ready.then(function () {
      return TN.signIn(userEmail, passwd.value);
    }).then(function (result) {
      if (result.error) throw result.error;

      setMsg('ok', 'Signed in. Loading your dashboard…');
      setTimeout(function () {
        window.location.href = 'dashboard.html';
      }, 400);
    }).catch(function (err) {
      console.error('[login]', err);
      var m = (err && err.message) || '';

      if (/Invalid login credentials/i.test(m)) {
        setMsg('err', 'Wrong email or password.');
      } else if (/Email not confirmed/i.test(m)) {
        setMsg('err', 'Account not confirmed. Check your email inbox.');
      } else if (/rate limit|too many/i.test(m)) {
        setMsg('err', 'Too many attempts. Wait a minute, then try again.');
      } else {
        setMsg('err', m || 'Something went wrong. Please try again.');
      }
      submit.disabled = false;
    });
  });

})();
</script>
</body>
</html>
