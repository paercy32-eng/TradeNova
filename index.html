<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f0fdf4">
<title>Root & Ripe — Grow Your Wealth</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0fdf4;
    color: white;
    height: 100vh;
    overflow: hidden;
  }

  /* Full-screen splash container */
  .splash {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    /* Dark green gradient over a high-quality farming background */
    background: linear-gradient(180deg, rgba(6, 95, 70, 0.5) 0%, rgba(6, 95, 70, 0.9) 80%, rgba(6, 95, 70, 1) 100%), 
                url('https://images.unsplash.com/photo-1595855759920-86582396756a?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
  }

  /* Logo */
  .logo-container {
    text-align: center;
    animation: fadeInDown 1s ease-out;
  }

  .logo-text {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .logo-text span {
    color: #f59e0b;
    text-shadow: 0 4px 20px rgba(245, 158, 11, 0.6);
  }

  .tagline {
    margin-top: 15px;
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a7f3d0;
    font-weight: 700;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* Enter Button */
  .enter-btn {
    position: absolute;
    bottom: 60px;
    background: linear-gradient(90deg, #10b981, #059669);
    color: #ffffff;
    text-decoration: none;
    padding: 1.2rem 4rem;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    transition: all 0.3s ease;
    animation: fadeInUp 1s ease-out;
  }

  .enter-btn:hover, .enter-btn:active {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6);
  }

  /* Loading Spinner */
  .spinner {
    display: none;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top: 4px solid #10b981;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    position: absolute;
    bottom: 80px;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="splash">
  
  <!-- Central Logo Area -->
  <div class="logo-container">
    <div class="logo-text">Root <span>&</span> Ripe</div>
    <div class="tagline">Grow Your Wealth</div>
  </div>

  <!-- Action Button -->
  <a href="login.html" class="enter-btn" id="enterBtn">Enter Now</a>
  
  <!-- Loading Spinner (Shows if session check takes a second) -->
  <div class="spinner" id="loadingSpinner"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  // If the user is already logged in, send them straight to the dashboard
  if (!window.TN || !TN.ready) {
    console.error('Supabase failed to load.');
    return;
  }

  // Show spinner briefly while checking
  document.getElementById('loadingSpinner').style.display = 'block';
  document.getElementById('enterBtn').style.display = 'none';

  TN.ready.then(function () {
    return TN.getSession();
  }).then(function (session) {
    if (session) {
      // User is logged in -> send to dashboard
      window.location.replace('dashboard.html');
    } else {
      // Not logged in -> show the Enter button
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('enterBtn').style.display = 'inline-block';
    }
  }).catch(function (err) {
    console.error('[gatekeeper]', err);
    // If there is an error, show the button anyway so they can try to log in
    document.getElementById('loadingSpinner').style.display = 'none';
    document.getElementById('enterBtn').style.display = 'inline-block';
  });

})();
</script>
</body>
</html>
