<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<title>Trade Nova — Loading</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    background: var(--bg);
    color: var(--text);
  }
  .loader {
    border: 3px solid var(--border);
    border-top: 3px solid var(--blue);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 1.5rem auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status { font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>

<div>
  <div class="loader"></div>
  <div class="status" id="statusText">Checking session...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  // Wait for Supabase to initialize
  if (!window.TN || !TN.ready) {
    document.getElementById('statusText').textContent = 'System failed to load. Refresh.';
    return;
  }

  TN.ready.then(function () {
    return TN.getSession();
  }).then(function (session) {
    if (session) {
      // User IS logged in -> Send to Dashboard
      window.location.replace('dashboard.html');
    } else {
      // User is NOT logged in -> Send to Login Page
      window.location.replace('login.html');
    }
  }).catch(function (err) {
    console.error('[gatekeeper]', err);
    // If there is an error, force them to login page
    window.location.replace('login.html');
  });

})();
</script>
</body>
</html>
