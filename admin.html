<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — Trade Nova</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  
  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 2rem; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
  .kpi-val { font-size: 1.3rem; font-weight: 800; color: var(--blue); margin-bottom: 0.2rem; }
  .kpi-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }

  /* Tabs */
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
  .tab-btn { background: none; border: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 0.5rem 1rem; border-radius: 6px; }
  .tab-btn.active { background: var(--surface-2); color: var(--text); }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 2rem; }
  .data-table th, .data-table td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .data-table th { background: var(--surface-2); color: var(--muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
  .data-table tr:last-child td { border-bottom: none; }
  
  .action-btn { padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
  .btn-approve { background: var(--green); color: #fff; }
  .btn-reject { background: var(--red-soft); color: var(--red); margin-left: 0.5rem; }
  
  .tier-group { margin-bottom: 2rem; }
  .tier-title { font-size: 1.1rem; font-weight: 700; color: var(--blue); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .tier-badge { background: var(--blue-soft); color: var(--blue); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
  .empty-state { padding: 2rem; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--radius); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="admin.html">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Trade Nova Admin</span>
    </a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-left:auto">Log out</button>
  </div>
</header>

<main class="wrap" style="padding-bottom: 4rem;">
  <div class="admin-header">
    <h2>Admin Control Panel</h2>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-val" id="kpiUsers">-</div>
      <div class="kpi-lbl">Total Users</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiDeposits" style="color:var(--green);">-</div>
      <div class="kpi-lbl">Total Deposited</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiWithdrawals" style="color:var(--red);">-</div>
      <div class="kpi-lbl">Total Withdrawn</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending')">Pending Actions</button>
    <button class="tab-btn" onclick="switchTab('users')">All Users</button>
  </div>

  <!-- TAB 1: Pending Actions -->
  <div id="tab-pending">
    <h3 style="margin-bottom:0.5rem;">Pending Crypto Deposits</h3>
    <div id="depositsContainer" class="empty-state">Loading...</div>

    <h3 style="margin-top:2rem; margin-bottom:0.5rem;">Pending Withdrawals</h3>
    <div id="withdrawalsContainer" class="empty-state">Loading...</div>
  </div>

  <!-- TAB 2: All Users -->
  <div id="tab-users" style="display:none;">
    <div id="usersContainer">Loading users...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  let allUsers = [];

  function initAdmin() {
    TN.ready.then(() => TN.getSession())
    .then(session => {
      if (!session) throw new Error('No session');
      return TN.client.from('profiles').select('role').eq('id', session.user.id).single();
    })
    .then(res => {
      if (res.data.role !== 'admin') {
        alert('Access Denied.');
        window.location.replace('dashboard.html');
        return;
      }
      
      fetchKPIs();
      loadDeposits();
      loadWithdrawals();
      loadUsers();

    })
    .catch(err => {
      console.error(err);
      if (err.message === 'No session') window.location.replace('login.html');
    });
  }

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');
    else document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
    
    document.getElementById('tab-pending').style.display = tab === 'pending' ? 'block' : 'none';
    document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
  };

  // --- KPIs ---
  function fetchKPIs() {
    TN.client.from('profiles').select('*', { count: 'exact', head: true }).then(res => {
      document.getElementById('kpiUsers').textContent = res.count || 0;
    });

    TN.client.from('pending_deposits').select('amount_usd').eq('status', 'verified').then(res => {
      const total = (res.data || []).reduce((sum, d) => sum + Number(d.amount_usd), 0);
      document.getElementById('kpiDeposits').textContent = '$' + total.toLocaleString();
    });

    TN.client.from('withdrawal_requests').select('amount_usd').eq('status', 'approved').then(res => {
      const total = (res.data || []).reduce((sum, w) => sum + Number(w.amount_usd), 0);
      document.getElementById('kpiWithdrawals').textContent = '$' + total.toLocaleString();
    });
  }

  // --- PENDING DEPOSITS ---
  function loadDeposits() {
    TN.client.from('pending_deposits')
      .select('*, profiles(full_name, email)')
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .then(res => {
        const container = document.getElementById('depositsContainer');
        if (!res.data || res.data.length === 0) {
          container.innerHTML = 'No pending deposits.'; return;
        }

        let html = `<table class="data-table"><thead><tr><th>User</th><th>Amount</th><th>TXID</th><th>Actions</th></tr></thead><tbody>`;
        res.data.forEach(d => {
          html += `<tr>
            <td>${d.profiles ? d.profiles.full_name : 'Unknown'}</td>
            <td style="font-weight:bold; color:var(--green);">$${d.amount_usd}</td>
            <td style="font-family:monospace; font-size:0.7rem; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.txid}</td>
            <td>
              <button class="action-btn btn-approve" onclick="approveDeposit('${d.id}', '${d.user_id}', ${d.amount_usd})">Approve</button>
              <button class="action-btn btn-reject" onclick="rejectDeposit('${d.id}')">Reject</button>
            </td>
          </tr>`;
        });
        container.innerHTML = html + '</tbody></table>';
      });
  }

  window.approveDeposit = async function(depositId, userId, amount) {
    if (!confirm(`Confirm $${amount} received? This unlocks their tier.`)) return;
    try {
      const { data: profile } = await TN.client.from('profiles').select('deposit_amount, total_deposited').eq('id', userId).single();
      
      const newDepositAmount = Number(profile.deposit_amount || 0) + Number(amount);
      const newTotalDeposited = Number(profile.total_deposited || 0) + Number(amount);

      await TN.client.from('profiles').update({ 
        deposit_amount: newDepositAmount,
        total_deposited: newTotalDeposited,
        active_day: 1
      }).eq('id', userId);

      await TN.client.from('pending_deposits').update({ status: 'verified' }).eq('id', depositId);
      
      alert('Approved! Commission paid & Tier unlocked.'); 
      fetchKPIs(); loadDeposits(); loadUsers();
    } catch (err) { alert(err.message); }
  };

  window.rejectDeposit = async function(depositId) {
    if (!confirm('Reject?')) return;
    await TN.client.from('pending_deposits').update({ status: 'rejected' }).eq('id', depositId);
    loadDeposits();
  };

  // --- PENDING WITHDRAWALS ---
  function loadWithdrawals() {
    TN.client.from('withdrawal_requests')
      .select('*, profiles(full_name, email)')
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .then(res => {
        const container = document.getElementById('withdrawalsContainer');
        if (!res.data || res.data.length === 0) {
          container.innerHTML = 'No pending withdrawals.'; return;
        }

        let html = `<table class="data-table"><thead><tr><th>User</th><th>Amount</th><th>Phone</th><th>Actions</th></tr></thead><tbody>`;
        res.data.forEach(w => {
          html += `<tr>
            <td>${w.profiles ? w.profiles.full_name : 'Unknown'}</td>
            <td style="font-weight:bold; color:var(--red);">-$${w.amount_usd}</td>
            <td>${w.mobile_money_provider}<br>${w.mobile_money_number}</td>
            <td>
              <button class="action-btn btn-approve" onclick="approveWithdrawal('${w.id}', '${w.user_id}', ${w.amount_usd})">Approve</button>
              <button class="action-btn btn-reject" onclick="rejectWithdrawal('${w.id}')">Reject</button>
            </td>
          </tr>`;
        });
        container.innerHTML = html + '</tbody></table>';
      });
  }

  window.approveWithdrawal = async function(withdrawalId, userId, amount) {
    if (!confirm(`Confirm you sent $${amount} to this user?`)) return;
    try {
      const { data: profile } = await TN.client.from('profiles').select('balance_usd, total_withdrawn').eq('id', userId).single();
      
      const newBalance = Number(profile.balance_usd || 0) - Number(amount);
      const newTotalWithdrawn = Number(profile.total_withdrawn || 0) + Number(amount);

      await TN.client.from('profiles').update({ 
        balance_usd: newBalance,
        total_withdrawn: newTotalWithdrawn 
      }).eq('id', userId);

      await TN.client.from('withdrawal_requests').update({ status: 'approved' }).eq('id', withdrawalId);
      
      alert('Withdrawal Approved!'); 
      fetchKPIs(); loadWithdrawals(); loadUsers();
    } catch (err) { alert(err.message); }
  };

  window.rejectWithdrawal = async function(withdrawalId) {
    if (!confirm('Reject?')) return;
    await TN.client.from('withdrawal_requests').update({ status: 'rejected' }).eq('id', withdrawalId);
    loadWithdrawals();
  };

  // --- ALL USERS (GROUPED) ---
  function loadUsers() {
    TN.client.from('profiles').select('*').order('deposit_amount', { ascending: false }).then(res => {
      if (!res.data) return;
      allUsers = res.data;
      renderGroupedUsers();
    });
  }

  function renderGroupedUsers() {
    const container = document.getElementById('usersContainer');
    container.innerHTML = '';

    const groups = {
      'VIP ($5000+)': [],
      'Tier 7 ($2000 - $4999)': [],
      'Tier 6 ($1000 - $1999)': [],
      'Tier 5 ($500 - $999)': [],
      'Tier 4 ($300 - $499)': [],
      'Tier 3 ($200 - $299)': [],
      'Tier 2 ($100 - $199)': [],
      'Tier 1 ($50 - $99)': [],
      'No Deposit (<$50)': []
    };

    allUsers.forEach(u => {
      const dep = Number(u.deposit_amount || 0);
      if (dep >= 5000) groups['VIP ($5000+)'].push(u);
      else if (dep >= 2000) groups['Tier 7 ($2000 - $4999)'].push(u);
      else if (dep >= 1000) groups['Tier 6 ($1000 - $1999)'].push(u);
      else if (dep >= 500) groups['Tier 5 ($500 - $999)'].push(u);
      else if (dep >= 300) groups['Tier 4 ($300 - $499)'].push(u);
      else if (dep >= 200) groups['Tier 3 ($200 - $299)'].push(u);
      else if (dep >= 100) groups['Tier 2 ($100 - $199)'].push(u);
      else if (dep >= 50) groups['Tier 1 ($50 - $99)'].push(u);
      else groups['No Deposit (<$50)'].push(u);
    });

    let html = '';
    for (const [tierName, users] of Object.entries(groups)) {
      if (users.length === 0) continue;
      
      html += `<div class="tier-group">
        <div class="tier-title">${tierName} <span class="tier-badge">${users.length} users</span></div>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Deposit</th><th>Balance</th></tr></thead><tbody>`;
      
      users.forEach(u => {
        html += `<tr>
          <td>${u.full_name || 'N/A'}</td>
          <td>${u.email}</td>
          <td>${u.phone || 'N/A'}</td>
          <td style="color:var(--green); font-weight:bold;">$${u.deposit_amount}</td>
          <td>$${u.balance_usd}</td>
        </tr>`;
      });
      
      html += `</tbody></table></div>`;
    }

    if (html === '') html = '<div class="empty-state">No users found.</div>';
    container.innerHTML = html;
  }

  document.getElementById('logoutBtn').addEventListener('click', function() {
    TN.signOut().then(() => window.location.replace('login.html'));
  });

  initAdmin();
})();
</script>
</body>
</html>
