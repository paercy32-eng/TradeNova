<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — Nova Trade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #f9fafb; color: #111827; padding-bottom: 2rem; }
  
  .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background: #ffffff; border-bottom: 1px solid #e5e7eb; margin-bottom: 1.5rem; }
  .brand { font-weight: 800; font-size: 1.2rem; color: #111827; }
  .brand span { color: #ec4899; }
  .btn-logout { background: #fdf2f8; border: 1px solid #fbcfe8; color: #ec4899; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

  .wrap { padding: 0 1.15rem; max-width: 1000px; margin: 0 auto; }
  
  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 2rem; }
  .kpi-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
  .kpi-val { font-size: 1.3rem; font-weight: 800; color: #ec4899; margin-bottom: 0.2rem; }
  .kpi-lbl { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; font-weight: bold; }

  /* Tabs */
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; }
  .tab-btn { background: none; border: none; color: #6b7280; font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 0.5rem 1rem; border-radius: 6px; }
  .tab-btn.active { background: #fdf2f8; color: #ec4899; }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 12px; overflow: hidden; margin-bottom: 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #e5e7eb; }
  .data-table th, .data-table td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 0.85rem; }
  .data-table th { background: #f9fafb; color: #6b7280; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
  .data-table tr:last-child td { border-bottom: none; }
  
  .action-btn { padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: #fff; }
  .btn-approve { background: #10b981; }
  .btn-reject { background: #ef4444; margin-left: 0.5rem; }
  
  .tier-group { margin-bottom: 2rem; }
  .tier-title { font-size: 1.1rem; font-weight: 700; color: #ec4899; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .tier-badge { background: #fdf2f8; color: #ec4899; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
  .empty-state { padding: 2rem; text-align: center; color: #6b7280; background: #ffffff; border-radius: 12px; border: 1px dashed #e5e7eb; }
</style>
</head>
<body>

<header class="admin-header">
  <div class="brand">Nova<span>Trade</span> Admin</div>
  <button class="btn-logout" id="logoutBtn">Log out</button>
</header>

<main class="wrap">
  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-val" id="kpiUsers">-</div>
      <div class="kpi-lbl">Total Users</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiDeposits" style="color:#10b981;">-</div>
      <div class="kpi-lbl">Total Deposited</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiWithdrawals" style="color:#ef4444;">-</div>
      <div class="kpi-lbl">Total Withdrawn</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending')">Pending Actions</button>
    <button class="tab-btn" onclick="switchTab('users')">All Users</button>
  </div>

  <!-- TAB 1: Pending Actions -->
  <div id="tab-pending">
    <h3 style="margin-bottom:0.5rem; color:#111827;">Pending Crypto Deposits (Manual)</h3>
    <div id="depositsContainer" class="empty-state">Loading...</div>

    <h3 style="margin-top:2rem; margin-bottom:0.5rem; color:#111827;">Pending Withdrawals</h3>
    <div id="withdrawalsContainer" class="empty-state">Loading...</div>
  </div>

  <!-- TAB 2: All Users -->
  <div id="tab-users" style="display:none;">
    <div id="usersContainer">Loading users...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  let allUsers = [];

  function initAdmin() {
    TN.ready.then(() => TN.getSession())
    .then(session => {
      if (!session) throw new Error('No session');
      return TN.client.from('profiles').select('role').eq('id', session.user.id).single();
    })
    .then(res => {
      if (res.data.role !== 'admin') {
        alert('Access Denied.');
        window.location.replace('dashboard.html');
        return;
      }
      fetchKPIs();
      loadDeposits();
      loadWithdrawals();
      loadUsers();
    })
    .catch(err => {
      console.error(err);
      if (err.message === 'No session') window.location.replace('login.html');
    });
  }

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');
    
    document.getElementById('tab-pending').style.display = tab === 'pending' ? 'block' : 'none';
    document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
  };

  // --- KPIs ---
  function fetchKPIs() {
    TN.client.from('profiles').select('*', { count: 'exact', head: true }).then(res => {
      document.getElementById('kpiUsers').textContent = res.count || 0;
    });

    TN.client.from('pending_deposits').select('amount_usd').eq('status', 'verified').then(res => {
      const total = (res.data || []).reduce((sum, d) => sum + Number(d.amount_usd), 0);
      document.getElementById('kpiDeposits').textContent = '$' + total.toLocaleString();
    });

    TN.client.from('withdrawal_requests').select('amount_usd').eq('status', 'approved').then(res => {
      const total = (res.data || []).reduce((sum, w) => sum + Number(w.amount_usd), 0);
      document.getElementById('kpiWithdrawals').textContent = '$' + total.toLocaleString();
    });
  }

  // --- PENDING DEPOSITS (MANUAL CRYPTO) ---
  function loadDeposits() {
    TN.client.from('pending_deposits')
      .select('*, profiles(full_name, email)')
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .then(res => {
        const container = document.getElementById('depositsContainer');
        if (!res.data || res.data.length === 0) {
          container.innerHTML = 'No pending crypto deposits.'; return;
        }

        let html = `<table class="data-table"><thead><tr><th>User</th><th>Amount</th><th>TXID</th><th>Actions</th></tr></thead><tbody>`;
        res.data.forEach(d => {
          html += `<tr>
            <td>${d.profiles ? d.profiles.full_name : 'Unknown'}</td>
            <td style="font-weight:bold; color:#10b981;">$${d.amount_usd}</td>
            <td style="font-family:monospace; font-size:0.7rem; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.txid}</td>
            <td>
              <button class="action-btn btn-approve" onclick="approveDeposit('${d.id}', '${d.user_id}', ${d.amount_usd})">Approve</button>
              <button class="action-btn btn-reject" onclick="rejectDeposit('${d.id}')">Reject</button>
            </td>
          </tr>`;
        });
        container.innerHTML = html + '</tbody></table>';
      });
  }

  window.approveDeposit = async function(depositId, userId, amount) {
    if (!confirm(`Confirm $${amount} received in Binance? This will add to their Available Balance.`)) return;
    try {
      const { data: profile } = await TN.client.from('profiles').select('balance_usd, total_deposited').eq('id', userId).single();
      
      // ADD TO BALANCE (Wallet), NOT DEPOSIT_AMOUNT (Plan)
      const newBalance = Number(profile.balance_usd || 0) + Number(amount);
      const newTotalDeposited = Number(profile.total_deposited || 0) + Number(amount);

      await TN.client.from('profiles').update({ 
        balance_usd: newBalance,
        total_deposited: newTotalDeposited
      }).eq('id', userId);

      await TN.client.from('pending_deposits').update({ status: 'verified' }).eq('id', depositId);
      
      alert('Approved! User balance updated.'); 
      fetchKPIs(); loadDeposits(); loadUsers();
    } catch (err) { alert(err.message); }
  };

  window.rejectDeposit = async function(depositId) {
    if (!confirm('Reject?')) return;
    await TN.client.from('pending_deposits').update({ status: 'rejected' }).eq('id', depositId);
    loadDeposits();
  };

  // --- PENDING WITHDRAWALS ---
  function loadWithdrawals() {
    TN.client.from('withdrawal_requests')
      .select('*, profiles(full_name, email)')
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .then(res => {
        const container = document.getElementById('withdrawalsContainer');
        if (!res.data || res.data.length === 0) {
          container.innerHTML = 'No pending withdrawals.'; return;
        }

        let html = `<table class="data-table"><thead><tr><th>User</th><th>Amount</th><th>Phone</th><th>Actions</th></tr></thead><tbody>`;
        res.data.forEach(w => {
          html += `<tr>
            <td>${w.profiles ? w.profiles.full_name : 'Unknown'}</td>
            <td style="font-weight:bold; color:#ef4444;">-$${w.amount_usd}</td>
            <td>${w.mobile_money_provider}<br>${w.mobile_money_number}</td>
            <td>
              <button class="action-btn btn-approve" onclick="approveWithdrawal('${w.id}', '${w.user_id}', ${w.amount_usd})">Approve</button>
              <button class="action-btn btn-reject" onclick="rejectWithdrawal('${w.id}')">Reject</button>
            </td>
          </tr>`;
        });
        container.innerHTML = html + '</tbody></table>';
      });
  }

  window.approveWithdrawal = async function(withdrawalId, userId, amount) {
    if (!confirm(`Confirm you sent $${amount} to this user?`)) return;
    try {
      const { data: profile } = await TN.client.from('profiles').select('balance_usd, total_withdrawn').eq('id', userId).single();
      
      const newBalance = Number(profile.balance_usd || 0) - Number(amount);
      const newTotalWithdrawn = Number(profile.total_withdrawn || 0) + Number(amount);

      await TN.client.from('profiles').update({ 
        balance_usd: newBalance,
        total_withdrawn: newTotalWithdrawn 
      }).eq('id', userId);

      await TN.client.from('withdrawal_requests').update({ status: 'approved' }).eq('id', withdrawalId);
      
      alert('Withdrawal Approved!'); 
      fetchKPIs(); loadWithdrawals(); loadUsers();
    } catch (err) { alert(err.message); }
  };

  window.rejectWithdrawal = async function(withdrawalId) {
    if (!confirm('Reject?')) return;
    await TN.client.from('withdrawal_requests').update({ status: 'rejected' }).eq('id', withdrawalId);
    loadWithdrawals();
  };

  // --- ALL USERS (GROUPED) ---
  function loadUsers() {
    TN.client.from('profiles').select('*').order('deposit_amount', { ascending: false }).then(res => {
      if (!res.data) return;
      allUsers = res.data;
      renderGroupedUsers();
    });
  }

  function renderGroupedUsers() {
    const container = document.getElementById('usersContainer');
    container.innerHTML = '';

    const groups = {
      'VIP ($5000+)': [],
      'Tier 7 ($2000 - $4999)': [],
      'Tier 6 ($1000 - $1999)': [],
      'Tier 5 ($500 - $999)': [],
      'Tier 4 ($300 - $499)': [],
      'Tier 3 ($200 - $299)': [],
      'Tier 2 ($100 - $199)': [],
      'Tier 1 ($50 - $99)': [],
      'No Active Plan': []
    };

    allUsers.forEach(u => {
      const dep = Number(u.deposit_amount || 0);
      if (dep >= 5000) groups['VIP ($5000+)'].push(u);
      else if (dep >= 2000) groups['Tier 7 ($2000 - $4999)'].push(u);
      else if (dep >= 1000) groups['Tier 6 ($1000 - $1999)'].push(u);
      else if (dep >= 500) groups['Tier 5 ($500 - $999)'].push(u);
      else if (dep >= 300) groups['Tier 4 ($300 - $499)'].push(u);
      else if (dep >= 200) groups['Tier 3 ($200 - $299)'].push(u);
      else if (dep >= 100) groups['Tier 2 ($100 - $199)'].push(u);
      else if (dep >= 50) groups['Tier 1 ($50 - $99)'].push(u);
      else groups['No Active Plan'].push(u);
    });

    let html = '';
    for (const [tierName, users] of Object.entries(groups)) {
      if (users.length === 0) continue;
      
      html += `<div class="tier-group">
        <div class="tier-title">${tierName} <span class="tier-badge">${users.length} users</span></div>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Active Plan</th><th>Wallet Bal</th></tr></thead><tbody>`;
      
      users.forEach(u => {
        html += `<tr>
          <td>${u.full_name || 'N/A'}</td>
          <td>${u.email}</td>
          <td>${u.phone || 'N/A'}</td>
          <td style="color:#ec4899; font-weight:bold;">$${u.deposit_amount}</td>
          <td style="color:#10b981; font-weight:bold;">$${u.balance_usd}</td>
        </tr>`;
      });
      
      html += `</tbody></table></div>`;
    }

    if (html === '') html = '<div class="empty-state">No users found.</div>';
    container.innerHTML = html;
  }

  document.getElementById('logoutBtn').addEventListener('click', function() {
    TN.signOut().then(() => window.location.replace('login.html'));
  });

  initAdmin();
})();
</script>
</body>
</html>
