<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<title>Dashboard — Trade Nova</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Dashboard specific styles */
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);
  }
  .user-profile {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--blue);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.2rem;
    text-transform: uppercase;
  }
  
  /* Wallet Card */
  .wallet-card {
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin: 1.5rem 0 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .wallet-balance {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
    margin: 0.2rem 0;
  }
  .wallet-label {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  /* Signal Feed */
  .signal-grid {
    display: grid;
    gap: 1rem;
    margin-top: 1rem;
  }
  @media (min-width: 760px) {
    .signal-grid { grid-template-columns: repeat(2, 1fr); }
  }
  
  .signal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .signal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .signal-pair { font-size: 1.2rem; font-weight: 800; }
  .signal-dir {
    font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 4px;
  }
  .dir-long { background: var(--green-soft); color: var(--green); }
  .dir-short { background: var(--red-soft); color: var(--red); }
  
  .signal-levels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    background: var(--bg);
    padding: 0.8rem;
    border-radius: 8px;
    text-align: center;
  }
  .signal-levels div { display: flex; flex-direction: column; }
  .signal-levels span { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
  .signal-levels strong { font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  
  .signal-meta {
    font-size: 0.8rem; color: var(--muted);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="dashboard.html">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3 17l5-6 4 3 5-7 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Trade Nova</span>
    </a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-left:auto">Log out</button>
  </div>
</header>

<main class="wrap" style="padding-bottom: 4rem;">
  
  <!-- User Header -->
  <div class="dash-header">
    <div class="user-profile">
      <div class="avatar" id="userInitial">U</div>
      <div>
        <h2 id="userName" style="margin:0; font-size:1.2rem;">Loading...</h2>
        <p id="userLocation" style="margin:0; font-size:0.85rem; color:var(--muted);">—</p>
      </div>
    </div>
  </div>

  <!-- Wallet -->
  <div class="wallet-card">
    <div>
      <div class="wallet-label">Available Balance</div>
      <div class="wallet-balance" id="walletBalance">$0.00</div>
      <div id="walletStatus" style="font-size:0.8rem; color:var(--muted);">Minimum deposit: $50.00</div>
    </div>
    <div>
      <button class="btn btn-primary" id="depositBtn">Deposit USD</button>
    </div>
  </div>

  <!-- Admin Signals Feed -->
  <div>
    <h3 style="font-size:1.3rem; margin-bottom:0.2rem;">Admin Signals</h3>
    <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.5rem;">
      Latest trades from the Trade Nova team. Click to execute.
    </p>
    
    <div class="signal-grid" id="signalGrid">
      <!-- Populated by JS -->
    </div>
  </div>

</main>

<!-- Deposit Modal (Native Dialog) -->
<dialog id="depositDialog" class="modal">
  <div class="modal-head">
    <div>
      <h3 style="margin:0;">Deposit Funds</h3>
      <p class="modal-sub">Minimum $50.00 required to copy signals.</p>
    </div>
    <button class="icon-btn" id="closeDeposit" aria-label="Close">✕</button>
  </div>
  <div style="padding: 1rem 0;">
    <div class="field">
      <label for="depositAmt">Amount (USD)</label>
      <input id="depositAmt" type="number" min="50" step="10" value="50" placeholder="50.00">
    </div>
    <p class="field-hint" style="margin-bottom:1rem;">Funds are processed securely via MarzPay (UGX) or Flutterwave.</p>
    <button class="btn btn-primary btn-block" id="confirmDeposit">Proceed to Payment</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  // Mock balance for demo purposes until MarzPay is hooked up
  const DEMO_BALANCE = 50.00; 
  const MIN_DEPOSIT = 50.00;

  // Mock Signals (Admin will create these in Supabase later)
  const MOCK_SIGNALS = [
    { id: '1', pair: 'BTC/USDT', dir: 'LONG', entry: '64,200', sl: '63,500', tp: '65,800', time: '2 mins ago' },
    { id: '2', pair: 'ETH/USDT', dir: 'SHORT', entry: '3,450', sl: '3,520', tp: '3,300', time: '1 hr ago' }
  ];

  function formatMoney(amount) {
    return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function initDashboard() {
    TN.ready.then(function () {
      return TN.getSession();
    }).then(function (session) {
      if (!session) {
        window.location.replace('login.html');
        return;
      }

      // Fetch profile
      return TN.client.from('profiles').select('*').eq('id', session.user.id).single();
        
    }).then(function (profileRes) {
      if (!profileRes || !profileRes.data) return;

      const profile = profileRes.data;
      
      // Update UI
      document.getElementById('userName').textContent = profile.full_name || 'Trader';
      document.getElementById('userLocation').textContent = `${profile.country || 'Unknown'} • ${profile.role || 'Follower'}`;
      document.getElementById('userInitial').textContent = (profile.full_name || 'U').charAt(0);
      
      // Set Wallet
      document.getElementById('walletBalance').textContent = formatMoney(DEMO_BALANCE);
      if (DEMO_BALANCE >= MIN_DEPOSIT) {
        document.getElementById('walletStatus').textContent = 'Account active. Ready to trade.';
        document.getElementById('walletStatus').style.color = 'var(--green)';
      }

      // Render Signals
      renderSignals(MOCK_SIGNALS);

    }).catch(function (err) {
      console.error('Dashboard init error:', err);
    });
  }

  function renderSignals(signals) {
    const grid = document.getElementById('signalGrid');
    grid.innerHTML = signals.map(s => {
      const dirClass = s.dir === 'LONG' ? 'dir-long' : 'dir-short';
      return `
        <div class="signal-card">
          <div class="signal-header">
            <span class="signal-pair">${s.pair}</span>
            <span class="signal-dir ${dirClass}">${s.dir}</span>
          </div>
          
          <div class="signal-levels">
            <div><span>Entry</span><strong>${s.entry}</strong></div>
            <div><span>Stop</span><strong class="neg">${s.sl}</strong></div>
            <div><span>Target</span><strong class="pos">${s.tp}</strong></div>
          </div>
          
          <div class="signal-meta">
            <span>Posted ${s.time}</span>
            <span>Admin</span>
          </div>
          
          <button class="btn btn-ghost btn-block" onclick="executeSignal('${s.pair}', '${s.dir}', ${DEMO_BALANCE})">
            Copy / Execute Trade
          </button>
        </div>
      `;
    }).join('');
  }

  // Wallet Deposit Logic
  const dialog = document.getElementById('depositDialog');
  document.getElementById('depositBtn').addEventListener('click', () => dialog.showModal());
  document.getElementById('closeDeposit').addEventListener('click', () => dialog.close());
  
  document.getElementById('confirmDeposit').addEventListener('click', function() {
    const amt = parseFloat(document.getElementById('depositAmt').value);
    if (amt < MIN_DEPOSIT) {
      alert("Minimum deposit is $50.00");
      return;
    }
    alert(`Redirecting to MarzPay/Flutterwave to collect $${amt}...`);
    dialog.close();
  });

  // Execute Signal Logic
  window.executeSignal = function(pair, dir, balance) {
    if (balance < MIN_DEPOSIT) {
      alert("You need a minimum balance of $50.00 to copy trades. Please deposit.");
      document.getElementById('depositDialog').showModal();
      return;
    }

    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Connecting to Binance...';

    // This is where the Edge Function call will happen later
    setTimeout(() => {
      btn.textContent = 'Trade Executed ✓';
      btn.style.color = 'var(--green)';
      btn.style.borderColor = 'var(--green)';
    }, 1500);
  };

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', function() {
    TN.signOut().then(() => window.location.replace('login.html'));
  });

  initDashboard();
})();
</script>
</body>
</html>
