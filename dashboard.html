<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<title>Dashboard — Trade Nova</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .dash-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .user-profile { display: flex; align-items: center; gap: 1rem; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; text-transform: uppercase; }
  
  .wallet-card { background: linear-gradient(135deg, var(--surface-2), var(--surface)); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1rem; }
  .wallet-balance { font-size: 2.2rem; font-weight: 800; color: var(--green); letter-spacing: -0.03em; margin: 0; }
  .wallet-label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
  
  .signal-slot { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .signal-slot.locked { opacity: 0.5; filter: grayscale(1); }
  .slot-time { font-size: 1.2rem; font-weight: 800; }
  .slot-status { font-size: 0.8rem; color: var(--muted); }
  
  .trade-btns { display: flex; gap: 0.5rem; }
  .btn-up { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); }
  .btn-down { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
  .btn-trade { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .btn-trade:disabled { opacity: 0.5; cursor: not-allowed; }

  .deposit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-top: 1rem; }
  .deposit-btn { background: var(--surface-2); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .deposit-btn:hover { border-color: var(--blue); background: var(--surface); }
  .deposit-btn span { display: block; font-size: 0.75rem; color: var(--muted); font-weight: normal; margin-top: 0.2rem;}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="dashboard.html">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Trade Nova</span>
    </a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
  </div>
</header>

<main class="wrap" style="padding-bottom: 4rem;">
  
  <div class="dash-header">
    <div class="user-profile">
      <div class="avatar" id="userInitial">U</div>
      <div>
        <h2 id="userName" style="margin:0; font-size:1.2rem;">Loading...</h2>
        <p id="userLocation" style="margin:0; font-size:0.85rem; color:var(--muted);">—</p>
      </div>
    </div>
  </div>

  <!-- Wallet -->
  <div class="wallet-card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div class="wallet-label">Available Balance (Profits + Bonus)</div>
        <div class="wallet-balance" id="walletBalance">$10.00</div>
      </div>
      <div style="text-align:right;">
        <div class="wallet-label">Deposit Principal</div>
        <div style="font-size:1.2rem; font-weight:700;" id="depositAmount">$0.00</div>
      </div>
    </div>
    
    <div style="display:flex; gap:0.5rem; margin-top:1rem;">
      <button class="btn btn-ghost" style="flex:1;" id="withdrawBtn">Withdraw</button>
      <button class="btn btn-primary" style="flex:1;" id="depositBtn">Add Funds</button>
    </div>
  </div>

  <!-- Trading Area -->
  <div>
    <h3 style="font-size:1.3rem; margin-bottom:0.2rem;">Today's Signals</h3>
    <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.5rem;">Choose UP or DOWN before the time expires.</p>
    
    <div id="signalsContainer">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Admin Tool -->
  <div style="margin-top:3rem; padding-top:2rem; border-top:1px dashed var(--border); text-align:center;">
    <p style="color:var(--muted); font-size:0.8rem; margin-bottom:0.5rem;">Admin Testing Tool</p>
    <button class="btn btn-primary" id="simulateBtn">Resolve Day & Add Profits</button>
  </div>

</main>

<!-- Deposit Modal -->
<dialog id="cryptoDepositDialog" class="modal">
  <div class="modal-head">
    <div>
      <h3 style="margin:0;">Deposit USDT</h3>
      <p class="modal-sub">Choose your plan. BSC (BEP20) only.</p>
    </div>
    <button class="icon-btn" id="closeCryptoDeposit">✕</button>
  </div>
  
  <div style="padding: 1rem 0;">
    <div class="deposit-grid" id="depositGrid">
      <!-- Populated by JS -->
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin: 1.5rem 0;">

    <div class="field">
      <label>Binance Wallet Address (BEP20)</label>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="binanceAddress" value="0x65f81e2e94e3c41f42a6dce117a7cf7bf9d0bf3a" readonly style="background:var(--bg); font-family:monospace;">
        <button class="btn btn-ghost btn-sm" id="copyAddressBtn">Copy</button>
      </div>
    </div>

    <form id="depositForm" style="display:none; flex-direction:column; gap:1rem; margin-top:1rem;">
      <input type="hidden" id="selectedAmount">
      <div class="field">
        <label for="depositTxidInput">Transaction Hash (TXID) for <span id="displayAmount"></span></label>
        <input type="text" id="depositTxidInput" placeholder="Paste TXID here" required style="background:var(--bg); font-family:monospace;">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitDepositBtn">Submit for Verification</button>
    </form>
    <p class="form-msg" id="depositMsg" role="status"></p>
  </div>
</dialog>

<!-- Withdraw Modal -->
<dialog id="withdrawDialog" class="modal">
  <div class="modal-head">
    <div>
      <h3 style="margin:0;">Withdraw Funds</h3>
      <p class="modal-sub">Cash out to Mobile Money. Min $50.</p>
    </div>
    <button class="icon-btn" id="closeWithdraw">✕</button>
  </div>
  
  <div style="padding: 1rem 0;">
    <form id="withdrawForm" style="display:flex; flex-direction:column; gap:1rem;">
      <div class="field">
        <label for="withdrawAmount">Amount (USD)</label>
        <input type="number" id="withdrawAmount" min="50" step="1" placeholder="Min $50" required style="background:var(--bg);">
        <p class="field-hint">Available: <span id="availableToWithdraw">$0.00</span></p>
      </div>
      <div class="field">
        <label for="mmProvider">Provider</label>
        <select id="mmProvider" required style="background:var(--bg);">
          <option value="MTN">MTN Mobile Money</option>
          <option value="Airtel">Airtel Money</option>
        </select>
      </div>
      <div class="field">
        <label for="mmNumber">Phone Number</label>
        <input type="tel" id="mmNumber" placeholder="e.g. 0771234567" required style="background:var(--bg);">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitWithdrawBtn" style="background:var(--red);">Request Withdrawal</button>
      <p class="form-msg" id="withdrawMsg" role="status"></p>
    </form>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  let currentUser = null;
  let currentProfile = null;
  let userTradesToday = [];

  const TIERS = [
    { amount: 5000, slots: ['8AM', '3PM', '5PM', '8PM'], maxProfit: 180 },
    { amount: 2000, slots: ['8AM', '3PM', '5PM', '8PM'], maxProfit: 60 },
    { amount: 1000, slots: ['3PM', '5PM', '8PM'], maxProfit: 40 },
    { amount: 500,  slots: ['3PM', '5PM'], maxProfit: 20 },
    { amount: 300,  slots: ['3PM', '5PM'], maxProfit: 15 },
    { amount: 200,  slots: ['3PM'], maxProfit: 9.5 },
    { amount: 100,  slots: ['3PM'], maxProfit: 7.5 },
    { amount: 50,   slots: ['3PM'], maxProfit: 5.0 },
    { amount: 0,    slots: [], maxProfit: 0 }
  ];

  function formatMoney(amount) {
    return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function getUserTier(deposit) {
    return TIERS.find(t => deposit >= t.amount) || TIERS[TIERS.length - 1];
  }

  function initDashboard() {
    TN.ready.then(() => TN.getSession())
    .then(session => {
      if (!session) throw new Error('No session');
      currentUser = session.user;
      return TN.client.from('profiles').select('*').eq('id', session.user.id).single();
    })
    .then(res => {
      if (!res.data) throw new Error('No profile');
      currentProfile = res.data;
      
      // Fetch today's trades
      const today = new Date().toISOString().split('T')[0];
      return TN.client.from('trades').select('*').eq('user_id', currentUser.id).gte('created_at', today);
    })
    .then(tradesRes => {
      if (tradesRes && tradesRes.data) {
        userTradesToday = tradesRes.data;
      }
      renderUI();
    })
    .catch(err => {
      console.error(err);
      if (err.message === 'No session') window.location.replace('login.html');
    });
  }

  function renderUI() {
    const p = currentProfile;
    const dep = Number(p.deposit_amount || 0);
    const tier = getUserTier(dep);

    document.getElementById('userName').textContent = p.full_name || 'Trader';
    document.getElementById('userLocation').textContent = `${p.country || 'Unknown'}`;
    document.getElementById('userInitial').textContent = (p.full_name || 'U').charAt(0);

    document.getElementById('walletBalance').textContent = formatMoney(p.balance_usd || 0);
    document.getElementById('depositAmount').textContent = formatMoney(dep);
    document.getElementById('availableToWithdraw').textContent = formatMoney(p.balance_usd || 0);

    renderSignals(tier);
  }

  function renderSignals(tier) {
    const container = document.getElementById('signalsContainer');
    const allSlots = ['8AM', '3PM', '5PM', '8PM'];
    let html = '';

    allSlots.forEach(slot => {
      const isUnlocked = tier.slots.includes(slot);
      const trade = userTradesToday.find(t => t.signal_time === slot);
      
      let actionHtml = '';
      if (!isUnlocked) {
        actionHtml = `<div class="slot-status" style="color:var(--red);">Requires higher deposit</div>`;
      } else if (trade) {
        if (trade.result === 'PENDING') {
          actionHtml = `<div class="slot-status" style="color:var(--blue); font-weight:bold;">Waiting for result...</div>`;
        } else if (trade.result === 'WIN') {
          actionHtml = `<div class="slot-status" style="color:var(--green); font-weight:bold;">WON +$${trade.profit_usd}</div>`;
        } else {
          actionHtml = `<div class="slot-status" style="color:var(--red); font-weight:bold;">LOST</div>`;
        }
      } else {
        actionHtml = `
          <div class="trade-btns">
            <button class="btn-trade btn-up" onclick="placeTrade('${slot}', 'UP')">UP</button>
            <button class="btn-trade btn-down" onclick="placeTrade('${slot}', 'DOWN')">DOWN</button>
          </div>
        `;
      }

      html += `
        <div class="signal-slot ${isUnlocked ? '' : 'locked'}">
          <div>
            <div class="slot-time">${slot}</div>
            <div class="slot-status">${isUnlocked ? 'Signal Available' : 'Locked'}</div>
          </div>
          ${actionHtml}
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // --- TRADING ---
  window.placeTrade = function(slot, choice) {
    if (!confirm(`Are you sure you want to trade ${choice} for the ${slot} signal?`)) return;

    TN.client.from('trades').insert({
      user_id: currentUser.id,
      signal_time: slot,
      user_choice: choice,
      result: 'PENDING'
    }).then(res => {
      if (res.error) throw res.error;
      alert('Trade placed successfully! Wait for Admin to resolve.');
      window.location.reload();
    }).catch(err => {
      alert('Error: ' + err.message);
    });
  };

  // --- ADMIN SIMULATE ---
  document.getElementById('simulateBtn').addEventListener('click', function() {
    const btn = this;
    btn.textContent = 'Resolving...';
    btn.disabled = true;

    // 1. Resolve all pending trades randomly for testing
    TN.client.from('trades').select('*').eq('result', 'PENDING').then(res => {
      if (!res.data || res.data.length === 0) {
        alert('No pending trades to resolve.');
        btn.textContent = 'Resolve Day & Add Profits';
        btn.disabled = false;
        return;
      }

      const promises = res.data.map(trade => {
        // Randomly decide if user won or lost
        const isWin = Math.random() > 0.5; 
        const profit = isWin ? 5.00 : 0.00; // Simplified profit for test
        
        if (isWin) {
          // Add profit to balance
          TN.client.rpc('increment_balance', { user_id: trade.user_id, amount: profit }).catch(()=>{});
        }

        return TN.client.from('trades').update({
          result: isWin ? 'WIN' : 'LOSS',
          profit_usd: profit
        }).eq('id', trade.id);
      });

      Promise.all(promises).then(() => {
        alert('Day resolved! Winners have been credited.');
        window.location.reload();
      });
    });
  });

  // --- DEPOSIT LOGIC ---
  const cryptoDialog = document.getElementById('cryptoDepositDialog');
  const depositForm = document.getElementById('depositForm');
  
  document.getElementById('depositBtn').addEventListener('click', () => {
    // Render Deposit Grid
    const grid = document.getElementById('depositGrid');
    grid.innerHTML = [50, 100, 200, 300, 500, 1000, 2000, 5000].map(amt => `
      <div class="deposit-btn" onclick="selectDepositAmount(${amt})">
        $${amt}
      </div>
    `).join('');
    cryptoDialog.showModal();
  });

  document.getElementById('closeCryptoDeposit').addEventListener('click', () => cryptoDialog.close());

  window.selectDepositAmount = function(amt) {
    document.getElementById('selectedAmount').value = amt;
    document.getElementById('displayAmount').textContent = '$' + amt;
    depositForm.style.display = 'flex';
    document.getElementById('depositTxidInput').focus();
  };

  document.getElementById('copyAddressBtn').addEventListener('click', function() {
    navigator.clipboard.writeText(document.getElementById('binanceAddress').value);
    this.textContent = 'Copied!';
    setTimeout(() => this.textContent = 'Copy', 1500);
  });

  depositForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('selectedAmount').value);
    const txid = document.getElementById('depositTxidInput').value.trim();
    const msg = document.getElementById('depositMsg');

    TN.client.from('pending_deposits').insert({
      user_id: currentUser.id,
      txid: txid,
      amount_usd: amount
    }).then(res => {
      if (res.error) throw res.error;
      msg.className = 'form-msg ok';
      msg.textContent = 'Submitted! Admin will verify and credit your deposit.';
    }).catch(err => {
      msg.className = 'form-msg err';
      msg.textContent = err.message;
    });
  });

  // --- WITHDRAW LOGIC ---
  const withdrawDialog = document.getElementById('withdrawDialog');
  
  document.getElementById('withdrawBtn').addEventListener('click', () => {
    const day = new Date().getDay(); // 0 = Sunday, 6 = Saturday
    if (day !== 0 && day !== 6) {
      alert('Withdrawals are only processed on Saturdays and Sundays.');
      return;
    }
    withdrawDialog.showModal();
  });
  
  document.getElementById('closeWithdraw').addEventListener('click', () => withdrawDialog.close());

  document.getElementById('withdrawForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    const msg = document.getElementById('withdrawMsg');

    if (amount < 50) {
      msg.className = 'form-msg err'; msg.textContent = 'Minimum is $50.'; return;
    }
    if (amount > Number(currentProfile.balance_usd)) {
      msg.className = 'form-msg err'; msg.textContent = 'Insufficient balance.'; return;
    }

    TN.client.from('withdrawal_requests').insert({
      user_id: currentUser.id,
      amount_usd: amount,
      mobile_money_provider: document.getElementById('mmProvider').value,
      mobile_money_number: document.getElementById('mmNumber').value
    }).then(res => {
      if (res.error) throw res.error;
      msg.className = 'form-msg ok';
      msg.textContent = 'Request submitted! Payment will be made this weekend.';
    }).catch(err => {
      msg.className = 'form-msg err';
      msg.textContent = err.message;
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    TN.signOut().then(() => window.location.replace('login.html'));
  });

  initDashboard();
})();
</script>
</body>
</html>
