<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080f">
<title>Create Account — Nova Trade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    background: #05080f;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  /* Centered Auth Card */
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: #0a111a;
    border: 1px solid #1a2636;
    border-radius: 16px;
    padding: 2.5rem 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  /* Logo */
  .logo-container { text-align: center; margin-bottom: 1.5rem; }
  .logo-text {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
  }
  .logo-text span {
    color: #00d2ff;
    text-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
  }

  h1 { font-size: 1.4rem; margin-bottom: 0.4rem; text-align: center; }
  .subtitle { color: #a0aabf; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }

  /* Form Fields */
  .field { margin-bottom: 1rem; }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #a0aabf;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input, .field select {
    width: 100%;
    padding: 0.85rem 1rem;
    background: #05080f;
    border: 1px solid #1a2636;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  .field select { appearance: none; }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #00d2ff;
    box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
  }

  /* Phone Input Group */
  .phone-group {
    display: flex;
    border: 1px solid #1a2636;
    border-radius: 10px;
    overflow: hidden;
    background: #05080f;
  }
  .phone-group:focus-within {
    border-color: #00d2ff;
    box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
  }
  .dial-code {
    display: flex;
    align-items: center;
    padding: 0 1rem;
    background: #0a111a;
    color: #a0aabf;
    font-weight: 600;
    border-right: 1px solid #1a2636;
  }
  .phone-group input {
    border: none;
    background: transparent;
    border-radius: 0;
    box-shadow: none !important;
  }

  /* Checkbox */
  .check-terms {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: #a0aabf;
    margin: 1.2rem 0;
    cursor: pointer;
  }
  .check-terms input {
    margin-top: 0.2rem;
    accent-color: #00d2ff;
    width: 16px;
    height: 16px;
  }
  .check-terms a { color: #00d2ff; text-decoration: none; }

  /* Button */
  .btn-submit {
    width: 100%;
    padding: 1rem;
    background: #00d2ff;
    color: #05080f;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-submit:hover { background: #00b8e6; transform: translateY(-2px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Messages & Links */
  .form-msg { text-align: center; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2rem; }
  .form-msg.err { color: #ea3943; }
  .form-msg.ok { color: #16c784; }

  .auth-foot { text-align: center; font-size: 0.85rem; color: #a0aabf; margin-top: 1.5rem; }
  .auth-foot a { color: #00d2ff; text-decoration: none; font-weight: 600; }
  .auth-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-card">
  
  <div class="logo-container">
    <div class="logo-text">Nova<span>Trade</span></div>
  </div>

  <h1>Create Account</h1>
  <p class="subtitle">Join Nova Trade and start earning.</p>

  <form id="registerForm" novalidate>
    <div class="field">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="" data-code="">Select Country</option>
        <optgroup label="East Africa">
          <option value="KE" data-code="+254">Kenya</option>
          <option value="UG" data-code="+256">Uganda</option>
          <option value="TZ" data-code="+255">Tanzania</option>
          <option value="RW" data-code="+250">Rwanda</option>
        </optgroup>
        <optgroup label="Central Africa">
          <option value="CM" data-code="+237">Cameroon</option>
        </optgroup>
        <optgroup label="Southern Africa">
          <option value="ZA" data-code="+27">South Africa</option>
          <option value="ZM" data-code="+260">Zambia</option>
          <option value="ZW" data-code="+263">Zimbabwe</option>
        </optgroup>
        <optgroup label="West Africa">
          <option value="NG" data-code="+234">Nigeria</option>
          <option value="GH" data-code="+233">Ghana</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <div class="phone-group">
        <span class="dial-code" id="dialCode">+</span>
        <input id="phone" name="phone" type="tel" inputmode="numeric" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8">
    </div>

    <div class="field">
      <label for="confirm">Confirm Password</label>
      <input id="confirm" name="confirm" type="password" required>
    </div>

    <div class="field">
      <label for="inviteCode">Invitation Code (Optional)</label>
      <input id="inviteCode" name="inviteCode" type="text" style="text-transform:uppercase">
    </div>

    <label class="check-terms">
      <input type="checkbox" id="terms" required>
      <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
    </label>

    <button class="btn-submit" type="submit" id="submitBtn">Create Account</button>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <p class="auth-foot">Already have an account? <a href="login.html">Sign In</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  var form      = document.getElementById('registerForm');
  var fullName  = document.getElementById('fullName');
  var email     = document.getElementById('email');
  var country   = document.getElementById('country');
  var phone     = document.getElementById('phone');
  var passwd    = document.getElementById('password');
  var confirm   = document.getElementById('confirm');
  var inviteCode= document.getElementById('inviteCode');
  var terms     = document.getElementById('terms');
  var dialCode  = document.getElementById('dialCode');
  var msg       = document.getElementById('formMsg');
  var submit    = document.getElementById('submitBtn');

  // Check URL for ?ref= code and pre-fill
  var urlParams = new URLSearchParams(window.location.search);
  var refFromUrl = urlParams.get('ref');
  if (refFromUrl) {
    inviteCode.value = refFromUrl.toUpperCase();
  }

  function setMsg(kind, text) {
    msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  country.addEventListener('change', function () {
    var opt = country.options[country.selectedIndex];
    dialCode.textContent = (opt && opt.dataset.code) || '+';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var opt  = country.options[country.selectedIndex];
    var code = (opt && opt.dataset.code) || '';

    if (!fullName.value.trim()) { setMsg('err', 'Enter your full name.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { setMsg('err', 'Enter a valid email.'); return; }
    if (!code) { setMsg('err', 'Select your country.'); return; }
    
    var local = phone.value.replace(/\D/g, '').replace(/^0+/, '');
    if (local.length < 7) { setMsg('err', 'Enter a valid phone number.'); return; }
    if (passwd.value.length < 8) { setMsg('err', 'Password must be at least 8 characters.'); return; }
    if (passwd.value !== confirm.value) { setMsg('err', 'Passwords do not match.'); return; }
    if (!terms.checked) { setMsg('err', 'Agree to the Terms.'); return; }

    var fullPhone = code.replace(/\D/g, '') + local;
    var finalRef = inviteCode.value.trim().toUpperCase();

    submit.disabled = true;
    setMsg('', 'Creating your account…');

    TN.ready.then(function () {
      return TN.client.auth.signUp({
        email: email.value.trim(),
        password: passwd.value,
        options: {
          data: {
            full_name: fullName.value.trim(),
            phone: fullPhone,
            country: country.value,
            country_code: code,
            invite_code: finalRef || null
          }
        }
      });
    }).then(function (result) {
      if (result.error) throw result.error;
      
      return TN.signOut().then(function () {
        setMsg('ok', 'Account created. Taking you to sign in…');
        form.reset();
        setTimeout(function () { window.location.href = 'login.html'; }, 1000);
      });

    }).catch(function (err) {
      console.error('[register]', err);
      var m = (err && err.message) || '';
      if (/already registered|User already/i.test(m)) {
        setMsg('err', 'An account with this email already exists.');
      } else {
        setMsg('err', m || 'Something went wrong.');
      }
      submit.disabled = false;
    });
  });

})();
</script>
</body>
</html>
