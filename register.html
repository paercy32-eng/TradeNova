<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdf2f8">
<title>Create Account — Nova Trade</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    background: #fdf2f8;
    color: #111827;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Trading Banner */
  .banner {
    width: 100%;
    height: 180px;
    background: linear-gradient(rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.2)), 
                url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
    border-bottom: 4px solid #ec4899;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .banner-text {
    color: #fff;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0,0,0,0.7);
  }
  .banner-text span { color: #ec4899; }

  /* Form Container */
  .auth-container {
    flex: 1;
    padding: 2rem 1.5rem;
    max-width: 450px;
    margin: 0 auto;
    width: 100%;
  }

  .auth-title {
    font-size: 1.4rem;
    color: #ec4899;
    font-weight: 800;
    margin-bottom: 1.5rem;
  }

  /* Input Fields */
  .field { margin-bottom: 1rem; }
  .input-group {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #fbcfe8;
    border-radius: 12px;
    padding: 0 1rem;
    transition: 0.2s;
  }
  .input-group:focus-within {
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
  }
  .input-group i {
    color: #ec4899;
    font-size: 1.1rem;
    width: 24px;
  }
  .input-group input, .input-group select {
    flex: 1;
    border: none;
    background: transparent;
    padding: 1rem 0.5rem;
    font-size: 0.95rem;
    color: #111827;
    outline: none;
    width: 100%;
  }
  .input-group input::placeholder { color: #9ca3af; }
  .input-group select { appearance: none; color: #111827; }
  
  /* Phone specific */
  .dial-code {
    color: #ec4899;
    font-weight: 800;
    border-right: 1px solid #fbcfe8;
    padding-right: 0.5rem;
    margin-right: 0.5rem;
  }

  /* Terms Checkbox */
  .check-terms {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: #4b5563;
    margin: 1.2rem 0;
    font-weight: 600;
  }
  .check-terms input {
    margin-top: 0.2rem;
    accent-color: #ec4899;
    width: 16px;
    height: 16px;
  }
  .check-terms a { color: #ec4899; text-decoration: none; font-weight: 800; }

  /* Submit Button */
  .btn-submit {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(90deg, #ec4899, #db2777);
    color: #ffffff;
    border: none;
    border-radius: 30px; /* Pill shape */
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    transition: 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5); }
  .btn-submit:disabled { opacity: 0.7; transform: none; box-shadow: none; }

  /* Messages & Footer */
  .form-msg { text-align: center; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2rem; font-weight: bold; }
  .form-msg.err { color: #ef4444; }
  .form-msg.ok { color: #10b981; }

  .auth-foot { text-align: center; font-size: 0.95rem; color: #4b5563; margin-top: 1.5rem; font-weight: 600; }
  .auth-foot a { color: #ec4899; text-decoration: none; font-weight: 800; }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-text">Nova<span>Trade</span></div>
</div>

<div class="auth-container">
  <h1 class="auth-title">Create Account</h1>

  <form id="registerForm" novalidate>
    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input id="fullName" name="fullName" type="text" placeholder="Full Name" autocomplete="name" required>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-globe"></i>
        <select id="country" name="country" required>
          <option value="" data-code="">Select Country</option>
          <optgroup label="East Africa">
            <option value="KE" data-code="+254">Kenya</option>
            <option value="UG" data-code="+256">Uganda</option>
            <option value="TZ" data-code="+255">Tanzania</option>
            <option value="RW" data-code="+250">Rwanda</option>
          </optgroup>
          <optgroup label="Central Africa">
            <option value="CM" data-code="+237">Cameroon</option>
          </optgroup>
          <optgroup label="Southern Africa">
            <option value="ZA" data-code="+27">South Africa</option>
            <option value="ZM" data-code="+260">Zambia</option>
            <option value="ZW" data-code="+263">Zimbabwe</option>
          </optgroup>
          <optgroup label="West Africa">
            <option value="NG" data-code="+234">Nigeria</option>
            <option value="GH" data-code="+233">Ghana</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <span class="dial-code" id="dialCode">+</span>
        <input id="phone" name="phone" type="tel" placeholder="Phone Number" inputmode="numeric" required>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input id="password" name="password" type="password" placeholder="Password" required minlength="8">
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input id="confirm" name="confirm" type="password" placeholder="Re-enter password" required>
      </div>
    </div>

    <div class="field">
      <div class="input-group">
        <i class="fa-solid fa-ticket"></i>
        <input id="inviteCode" name="inviteCode" type="text" placeholder="Invitation Code (Optional)" style="text-transform:uppercase">
      </div>
    </div>

    <label class="check-terms">
      <input type="checkbox" id="terms" required>
      <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
    </label>

    <button class="btn-submit" type="submit" id="submitBtn">Register</button>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  'use strict';

  var form      = document.getElementById('registerForm');
  var fullName  = document.getElementById('fullName');
  var email     = document.getElementById('email');
  var country   = document.getElementById('country');
  var phone     = document.getElementById('phone');
  var passwd    = document.getElementById('password');
  var confirm   = document.getElementById('confirm');
  var inviteCode= document.getElementById('inviteCode');
  var terms     = document.getElementById('terms');
  var dialCode  = document.getElementById('dialCode');
  var msg       = document.getElementById('formMsg');
  var submit    = document.getElementById('submitBtn');

  var urlParams = new URLSearchParams(window.location.search);
  var refFromUrl = urlParams.get('ref');
  if (refFromUrl) {
    inviteCode.value = refFromUrl.toUpperCase();
  }

  function setMsg(kind, text) {
    msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  country.addEventListener('change', function () {
    var opt = country.options[country.selectedIndex];
    dialCode.textContent = (opt && opt.dataset.code) || '+';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var opt  = country.options[country.selectedIndex];
    var code = (opt && opt.dataset.code) || '';

    if (!fullName.value.trim()) { setMsg('err', 'Enter your full name.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { setMsg('err', 'Enter a valid email.'); return; }
    if (!code) { setMsg('err', 'Select your country.'); return; }
    
    var local = phone.value.replace(/\D/g, '').replace(/^0+/, '');
    if (local.length < 7) { setMsg('err', 'Enter a valid phone number.'); return; }
    if (passwd.value.length < 8) { setMsg('err', 'Password must be at least 8 characters.'); return; }
    if (passwd.value !== confirm.value) { setMsg('err', 'Passwords do not match.'); return; }
    if (!terms.checked) { setMsg('err', 'Agree to the Terms.'); return; }

    var fullPhone = code.replace(/\D/g, '') + local;
    var finalRef = inviteCode.value.trim().toUpperCase();

    submit.disabled = true;
    setMsg('', 'Creating your account…');

    TN.ready.then(function () {
      return TN.client.auth.signUp({
        email: email.value.trim(),
        password: passwd.value,
        options: {
          data: {
            full_name: fullName.value.trim(),
            phone: fullPhone,
            country: country.value,
            country_code: code,
            invite_code: finalRef || null
          }
        }
      });
    }).then(function (result) {
      if (result.error) throw result.error;
      
      return TN.signOut().then(function () {
        setMsg('ok', 'Account created. Taking you to sign in…');
        form.reset();
        setTimeout(function () { window.location.href = 'login.html'; }, 1000);
      });

    }).catch(function (err) {
      console.error('[register]', err);
      var m = (err && err.message) || '';
      if (/already registered|User already/i.test(m)) {
        setMsg('err', 'An account with this email already exists.');
      } else {
        setMsg('err', m || 'Something went wrong.');
      }
      submit.disabled = false;
    });
  });

})();
</script>
</body>
</html>
